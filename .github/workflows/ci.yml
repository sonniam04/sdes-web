name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ช่องโหว่ระดับ critical ใน dependency ที่ใช้งานจริงทำให้ CI ไม่ผ่าน (spec platform-security)
      - run: pnpm test:scripts
      - run: pnpm audit:gate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:contrast
      - run: pnpm build
      # Playwright ใช้ API จำลอง จึงไม่ต้องมี backend
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          PW_CHANNEL: chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
